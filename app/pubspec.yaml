name: taskwise
description: "Personal self-hosted to-do and reminders app."
publish_to: none
version: 0.6.0+9
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: 2.35.2
  drift_flutter: 0.3.1
  flutter_local_notifications: 22.3.3
  flutter_riverpod: 3.4.3
  flutter_timezone: 5.1.1
  intl: 0.20.3
  launch_at_startup: 0.5.1
  path_provider: 2.1.6
  taskwise_shared: any
  timezone: 0.11.2
  tray_manager: 0.8.0
  uuid: 4.6.0
  window_manager: 0.5.2
  flutter_secure_storage: 10.0.0
  http: 1.6.0
  flutter_map: 8.3.2
  latlong2: 0.10.1
  workmanager: 0.10.10
  file_selector: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: 2.15.3
  drift_dev: 2.35.1
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Tray icon (Brutal design).
    - assets/tray/tray.png
  fonts:
    # One font set per design (lib/ui/designs/), all under the SIL Open Font
    # License (assets/fonts/OFL-*.txt).
    # Classic and Slate & Indigo: Noto Sans + Noto Sans Arabic.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    # Lapis: IBM Plex Sans Arabic (Arabic and Latin in one family).
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Brutal: Space Grotesk (Latin) + Alexandria (Arabic).
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Regular.ttf
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
