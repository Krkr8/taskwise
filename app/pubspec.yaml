name: taskwise
description: "Personal self-hosted to-do and reminders app."
publish_to: none
version: 0.4.0+6
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: 2.35.2
  drift_flutter: 0.3.1
  flutter_local_notifications: 22.3.3
  flutter_riverpod: 3.4.3
  flutter_timezone: 5.1.1
  intl: 0.20.3
  launch_at_startup: 0.5.1
  path_provider: 2.1.6
  taskwise_shared: any
  timezone: 0.11.2
  tray_manager: 0.8.0
  uuid: 4.6.0
  window_manager: 0.5.2
  flutter_secure_storage: 10.0.0
  http: 1.6.0
  flutter_map: 8.3.2
  latlong2: 0.10.1
  workmanager: 0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.15.3
  drift_dev: 2.35.1
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Tray icon placeholder (a teal check); the real app icon comes in M8.
    - assets/tray/tray.png
  fonts:
    # Noto Sans + Noto Sans Arabic, SIL Open Font License (assets/fonts/OFL.txt).
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
