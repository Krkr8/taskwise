<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by `flutter build web --base-href` (the site uses /app/). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Tasks and reminders, synced through your own server.">

  <!-- The Brutal design's paper colour, light and dark. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F0E1">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#3B342E">

  <!-- iPhone Home Screen app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Taskwise">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">

  <title>Taskwise</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { background: #F7F0E1; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #3B342E; }
    }
  </style>

  <script>
    // `#server=<address>` (docs/web-app.md) pre-fills the sign-in form. The
    // app reads it from here (lib/platform/launch_params_web.dart); it's
    // taken out of the address before Flutter starts, which would read it as
    // a page of the app.
    (function () {
      if (location.hash.indexOf('server=') < 0) return;
      window.taskwiseLaunchHash = location.hash.slice(1);
      history.replaceState(history.state, '', location.pathname + location.search);
    })();
  </script>

  <script>
    // The page side of sw.js (see app/web_README.md). The app reads
    // `taskwiseNewVersionReady`, listens for `taskwise-new-version` and calls
    // `taskwiseReloadToNewVersion()` (lib/platform/web_shell_web.dart).
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var waiting = null;
      var reloading = false;
      var controlled = !!navigator.serviceWorker.controller;

      function newVersion(worker) {
        if (waiting) return;
        waiting = worker;
        window.taskwiseNewVersionReady = true;
        window.dispatchEvent(new Event('taskwise-new-version'));
      }

      window.taskwiseReloadToNewVersion = function () {
        if (!waiting) {
          location.reload();
          return;
        }
        waiting.postMessage({ type: 'reload' });
        // If the new worker doesn't take over, reload anyway.
        setTimeout(function () { location.reload(); }, 3000);
      };

      // The first visit: the files loaded before the worker took over didn't
      // go through it. Tell it which ones they were (the app's own; the
      // worker checks again), so the next start works offline.
      function listLoadedFiles() {
        var worker = navigator.serviceWorker.controller;
        if (!worker) return;
        var appFolder = new URL('./', document.baseURI).href;
        var seen = {};
        function send(names) {
          var urls = names.filter(function (name) {
            if (seen[name] || name.indexOf(appFolder) !== 0) return false;
            seen[name] = true;
            return true;
          });
          if (urls.length) worker.postMessage({ type: 'cache', urls: urls });
        }
        function names(entries) {
          return entries.map(function (entry) { return entry.name; });
        }
        send([location.href].concat(names(performance.getEntriesByType('resource'))));
        // Files that finish loading later (CanvasKit, fonts).
        try {
          new PerformanceObserver(function (list) {
            send(names(list.getEntries()));
          }).observe({ type: 'resource', buffered: true });
        } catch (_) {}
      }

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!waiting) {
          // The first worker took over this page (clients.claim()).
          if (!controlled) {
            controlled = true;
            listLoadedFiles();
          }
          return;
        }
        // The new worker took over (after 'reload', maybe from another tab).
        if (reloading) return;
        reloading = true;
        location.reload();
      });

      navigator.serviceWorker.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'new-version' && event.source) {
          newVersion(event.source);
        }
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (registration) {
          if (registration.waiting && navigator.serviceWorker.controller) {
            newVersion(registration.waiting);
          }
          registration.addEventListener('updatefound', function () {
            var worker = registration.installing;
            if (!worker) return;
            worker.addEventListener('statechange', function () {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                newVersion(worker);
              }
            });
          });
        }).catch(function (error) {
          console.warn('Taskwise: no service worker', error);
        });
      });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
