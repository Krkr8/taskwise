name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      # The tray plugin (tray_manager → nativeapi) builds native code when
      # the app's tests start, which needs GTK 3, X11 and Xi headers.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-3-dev libx11-dev libxi-dev

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # Generated code (drift, localizations) is committed; make sure it's
      # up to date with its sources.
      - name: Check generated code is up to date
        working-directory: app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Analyze
        run: flutter analyze

      - name: Test app
        working-directory: app
        run: flutter test

      # Two app devices syncing through the real TypeScript server, on a
      # fresh in-memory database (app/test/sync/live_server_test.dart).
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Test app against the sync server
        run: |
          (cd server && npm ci)
          (cd server && DATABASE_URL=:memory: SETUP_SECRET=live-test-secret \
            PORT=8787 npx tsx src/node.ts > /tmp/server.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -fs http://localhost:8787/api/v1/health && break
            sleep 1
          done
          cd app
          TASKWISE_TEST_SERVER=http://localhost:8787 \
            TASKWISE_TEST_SETUP_SECRET=live-test-secret \
            flutter test --tags live || { cat /tmp/server.log; exit 1; }

      # Dates and recurrence must not depend on the device timezone or DST.
      - name: Test shared (several timezones)
        working-directory: shared
        run: |
          for tz in Asia/Baghdad America/New_York Europe/London; do
            echo "TZ=$tz"
            TZ=$tz dart test
          done

  # The sync server (TypeScript, deployed on Vercel). Its contract tests
  # read the JSON fixtures in shared/test/fixtures/sync.
  # Location reminders' Swift logic (GeofenceEngine) is platform-free, so the
  # walk simulator and the Swift unit tests run on Linux too.
  location-logic:
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Swift unit tests
        run: tools/geofence_sim/run.sh test
      - name: Walk simulator
        run: tools/geofence_sim/run.sh

  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
