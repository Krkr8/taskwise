name: Release builds

# Builds the app for Linux, Windows and iOS (unsigned, for SideStore).
# - Manual run (Actions tab → "Release builds" → Run workflow): artifacts only.
# - Pushing a tag like v0.1.0: also publishes a GitHub Release.
# Not run on every push: macOS minutes are the most expensive.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # gh release create

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: version
        name: Read version (and check the tag matches it)
        run: |
          version="$(tool/app_version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/pubspec.yaml version $version (expected v$version)"
            exit 1
          fi

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: app
        run: flutter build linux --release
      - name: Package
        run: tool/package_linux.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux
          path: dist/taskwise-${{ needs.version.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $release = "app/build/windows/x64/runner/Release"
          # Bundle the VC++ runtime so the app runs on PCs without it installed.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" $release
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "dist/Taskwise"
          Copy-Item -Recurse $release $stage
          Compress-Archive -Path $stage -DestinationPath "dist/taskwise-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows
          path: dist/taskwise-${{ needs.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  ios:
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build (unsigned; SideStore signs it on the phone)
        working-directory: app
        run: flutter build ios --release --no-codesign
      - name: Package .ipa
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist/ipa/Payload
          cp -R app/build/ios/iphoneos/Runner.app dist/ipa/Payload/
          (cd dist/ipa && zip -qry "../taskwise-$VERSION-ios-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ios
          path: dist/taskwise-${{ needs.version.outputs.version }}-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, windows, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Draft only: drafts stay private until the owner publishes them by hand.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Taskwise $GITHUB_REF_NAME" \
            --generate-notes \
            --draft
