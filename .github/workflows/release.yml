name: Release builds

# Builds the app for Linux (tar.gz and AppImage), Windows, Android (signed
# APK) and iOS (unsigned, for SideStore), and signs the list of files for
# the in-app updates.
# - Manual run (Actions tab → "Release builds" → Run workflow): artifacts only.
# - Pushing a tag like v0.1.0: also creates a draft GitHub Release, with the
#   matching CHANGELOG.md section as its text.
# Not run on every push: macOS minutes are the most expensive.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # gh release create

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: version
        name: Read version (and check the tag matches it)
        run: |
          version="$(tool/app_version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/pubspec.yaml version $version (expected v$version)"
            exit 1
          fi

  linux:
    needs: version
    # The oldest supported Ubuntu, so the build runs on distributions with
    # glibc 2.35 or newer (Debian 12+, Ubuntu 22.04+, Arch, Fedora).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libx11-dev libxi-dev libsecret-1-dev patchelf
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: app
        run: flutter build linux --release
      - name: Package (tar.gz)
        run: tool/package_linux.sh
      - name: Package (AppImage)
        run: tool/package_appimage.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux
          path: |
            dist/taskwise-${{ needs.version.outputs.version }}-linux-x64.tar.gz
            dist/taskwise-${{ needs.version.outputs.version }}-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $release = "app/build/windows/x64/runner/Release"
          # Bundle the VC++ runtime so the app runs on PCs without it installed.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" $release
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "dist/Taskwise"
          Copy-Item -Recurse $release $stage
          Compress-Archive -Path $stage -DestinationPath "dist/taskwise-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows
          path: dist/taskwise-${{ needs.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # The release key lives only in GitHub secrets (and with the
      # maintainer). Every release must use the same key, or Android
      # refuses to update the installed app.
      - name: Build (signed APK)
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          flutter build apk --release
          rm -f "$ANDROID_KEYSTORE_PATH"
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/taskwise-$VERSION-android.apk"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android
          path: dist/taskwise-${{ needs.version.outputs.version }}-android.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build (unsigned; SideStore signs it on the phone)
        working-directory: app
        run: flutter build ios --release --no-codesign
      - name: Package .ipa
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist/ipa/Payload
          cp -R app/build/ios/iphoneos/Runner.app dist/ipa/Payload/
          (cd dist/ipa && zip -qry "../taskwise-$VERSION-ios-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ios
          path: dist/taskwise-${{ needs.version.outputs.version }}-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, windows, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      # In-app updates (M12): SHA256SUMS of every file, signed with the
      # release key (secret UPDATE_SIGNING_KEY; the app has the public half),
      # plus the SideStore source for the iPhone. See docs/updates.md.
      - name: Sign for in-app updates
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tool/make_sidestore_source.sh "$VERSION" dist > dist/sidestore-source.json
          tool/sign_release.sh dist
      # Draft only: drafts stay private until a maintainer publishes them by hand.
      # The release text is this version's section of CHANGELOG.md. Without
      # one, GitHub writes notes from the commits instead.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          if tool/changelog_section.sh "$VERSION" > release-notes.md; then
            notes=(--notes-file release-notes.md)
          else
            echo "::warning::No CHANGELOG.md entry for $VERSION; using generated release notes"
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Taskwise $GITHUB_REF_NAME" \
            "${notes[@]}" \
            --draft
