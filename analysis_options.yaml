# Shared analyzer settings. Each package includes this file and adds its lint set.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/build/**"
    - "**/*.g.dart"

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
